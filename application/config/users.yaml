# FAKE demo accounts for the ShiftSense PoC. Passwords are listed on the login screen.
# Hashes: PBKDF2-SHA256, 100k iterations, salt 'shiftsense:<username>'. Real deployments use SSO.
roles:
  # Six business roles. pages: first entry is the home screen.
  # Permissions are enforced on the server in shiftsense/services.py; read-only in the app.
  admin:
    label: Admin
    pages: [admin]
    permissions: [governance, view_audit, all_teams, manage_accounts, propose_governance_rules]
  analyst:
    # forecasting, planning and publication + demo handling (scenario, clock, import)
    label: Analyst
    pages: [planner, data, demo]
    permissions: [replan, all_teams, manage_demo, run_clock, live_clock, import, escalate_risk, manage_data, report_situation]
  team_lead:
    label: Team Lead
    pages: [team]
    permissions: [report_absence, decide_fix, approve_requests, message, send_reminder, propose_data, report_situation]
  ops_head:
    label: Ops
    pages: [ops]
    permissions: [ops_decide, approve_requests, report_spike, view_audit, all_teams, message, approve_data, manage_service_levels, report_situation]
  hr:
    # people data: employee details, employment contracts, leave; decides team leads' agent proposals
    label: HR
    pages: [hr]
    permissions: [manage_people, all_teams]
  agent:
    label: Agent
    pages: [me]
    permissions: [request_leave, report_self, message, own_preferences]
